[llm]
base_url = "https://api.deepseek.com"
api_key = "sk-xxx"
model = "deepseek-v4-flash"
timeout_s = 30
# 翻译建议保持 false：V4 默认会先思考数秒才出译文
thinking = false

[app]
target_lang = "zh"
min_chars = 2
max_chars = 8000
always_on_top = true
cache_size = 128
font_size = 12

# 浏览器扩展本机桥接（仅 127.0.0.1；token 由「开始配对」写入，勿手填密钥到扩展）
[bridge]
enabled = false
port = 17890
token = ""

[llm]
base_url = "https://api.deepseek.com"
api_key = "sk-xxx"
model = "deepseek-v4-flash"
timeout_s = 30
# 翻译建议保持 false：V4 默认会先思考数秒才出译文
thinking = false

[dictionary]
# 可选：个人 / 非商业用途的 Merriam-Webster Dictionary API Key。
# 留空时使用 FreeDictionaryAPI + Wiktionary 词源。
merriam_webster_api_key = ""

[app]
target_lang = "zh"
min_chars = 2
max_chars = 8000
always_on_top = true
cache_size = 128
font_size = 12
# Windows：选中文本后一步复制并问答；可在设置中修改
# macOS 首次生成配置时会写成 Alt+Shift+Q（⌥⇧Q）
question_hotkey = "Ctrl+Shift+Q"

[manual_input]
# Windows：呼出半透明手动输入框，Enter 提交翻译
# macOS 首次生成配置时会写成 Alt+M（⌥M）；配置里 Ctrl=Control、Cmd=Command
hotkey = "Ctrl+M"
opacity = 0.82
width = 420
height = 144

# 浏览器扩展本机桥接（仅 127.0.0.1；token 由配对 / Native Messaging 写入，勿手填密钥到扩展）
[bridge]
enabled = true
port = 17890
token = ""

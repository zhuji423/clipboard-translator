<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clipboard Translator</title>
    <style>
      body {
        margin: 0;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #1e1f22;
        color: #e8eaed;
        width: 320px;
      }
      main { padding: 12px 14px 14px; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
      .status { padding: 8px 10px; background: #2b2d31; border-radius: 8px; margin-bottom: 10px; }
      label { color: #c4c7cc; }
      input[type="text"], input[type="number"], select {
        width: 100%;
        box-sizing: border-box;
        background: #2b2d31;
        color: #e8eaed;
        border: 1px solid #3c4048;
        border-radius: 6px;
        padding: 6px 8px;
      }
      button {
        background: #3c78d8;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.secondary { background: #3c4048; }
      button:disabled { opacity: 0.5; cursor: default; }
      .hint { color: #9aa0a6; font-size: 12px; margin-top: 8px; }
      .ok { color: #81c995; }
      .bad { color: #f28b82; }
    </style>
  </head>
  <body>
    <main>
      <h1>Clipboard Translator · 字幕</h1>
      <div id="status" class="status">检查桌面端…</div>
      <div class="row">
        <input id="enabled" type="checkbox" checked />
        <label for="enabled">启用点词查义</label>
      </div>
      <div class="row">
        <label for="targetLang" style="min-width: 4em">目标语</label>
        <select id="targetLang">
          <option value="zh">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <div class="row">
        <label for="port" style="min-width: 4em">端口</label>
        <input id="port" type="number" min="1024" max="65535" value="17890" />
      </div>
      <div class="row">
        <input id="code" type="text" placeholder="桌面端配对码（6 位）" maxlength="8" />
      </div>
      <div class="row">
        <button id="autoPairBtn">自动连接</button>
        <button id="pairBtn">短码连接</button>
        <button id="refreshBtn" class="secondary">刷新</button>
      </div>
      <p id="hint" class="hint">
        安装桌面端后优先点「自动连接」；失败时在桌面端「开始配对」并在此输入 6 位码。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
